services:
  app:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /var/www/html
    environment:
      APP_URL: http://localhost:8088
      MAIL_MAILER: log
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: truck_tracker
      DB_USERNAME: truck
      DB_PASSWORD: local-truck-password
    volumes:
      - .:/var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8080 --no-reload
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      mysql:
        condition: service_healthy
  tests:
    profiles: [testing]
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: testing
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: truck_tracker_test
      DB_USERNAME: truck_test
      DB_PASSWORD: local-test-password
      MAIL_MAILER: array
    command: php artisan test --compact
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: truck_tracker
      MYSQL_USER: truck
      MYSQL_PASSWORD: local-truck-password
      MYSQL_ROOT_PASSWORD: local-root-password
    volumes:
      - truck_mysql:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/test.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-password"]
      interval: 3s
      retries: 40
volumes:
  truck_mysql:
