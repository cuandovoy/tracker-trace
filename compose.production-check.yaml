services:
  production:
    image: truck-tracker:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8089
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: truck_tracker
      DB_USERNAME: truck
      DB_PASSWORD: local-truck-password
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    depends_on:
      mysql:
        condition: service_healthy
