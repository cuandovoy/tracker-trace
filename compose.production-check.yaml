services:
  production:
    image: truck-tracker:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8089
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      DB_CONNECTION: mysql
      DB_HOST: production-db
      DB_PORT: 3306
      DB_DATABASE: truck_tracker_smoke
      DB_USERNAME: truck
      DB_PASSWORD: local-truck-password
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    depends_on:
      production-db:
        condition: service_healthy
  production-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: truck_tracker_smoke
      MYSQL_USER: truck
      MYSQL_PASSWORD: local-truck-password
      MYSQL_ROOT_PASSWORD: local-smoke-root-password
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-smoke-root-password"]
      interval: 3s
      retries: 40
