worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/nginx-client;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    # Keep the normalized host and preserve an explicit port for local previews.
    map $http_host $client_host_port {
        default "";
        ~:(?<client_port>[0-9]+)$ :$client_port;
    }
    server {
        listen 8080;
        root /var/www/html/public;
        index index.php;
        client_max_body_size 2m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location /build/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
        location ~ ^/index\.php$ {
            include /etc/nginx/app_fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_hide_header X-Powered-By;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
